<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Service</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-room-service.css">
</head>
<body>
    <div class="container">
        <h1>Room Service</h1>
        <p>Reservación: <span id="reservaIdDisplay">Cargando...</span></p>
        <div id="menuItemsContainer">
            <div class="cards-container" id="cardsContainer">
                <!-- Cards de platillos aquí -->
            </div>
        </div>
        <div class="order-summary" id="orderSummary">
            <h2>Tu Pedido</h2>
            <div id="orderItems"></div>
            <p>Total: $<span id="orderTotal">0.00</span></p>
            <button id="placeOrderBtn" disabled>Realizar pedido</button>
            <div id="messageArea"></div>
        </div>
    </div>
    <script>
        // Configura la URL base de la API (ajusta si usas túnel)
        // Para pruebas en red local, usa la IP local:
        const API_BASE_URL = 'http://192.168.1.106:3000/api';

        let reservaId = null;
        let platillosDisponibles = [];
        let pedido = []; // { platillo_id, nombre, precio, cantidad }

        // Leer reserva_id de la URL (soporta mayúsculas/minúsculas y espacios)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            // Busca el parámetro ignorando mayúsculas/minúsculas
            let reservaIdParam = null;
            for (const [key, value] of urlParams.entries()) {
                if (key.toLowerCase() === 'reserva_id') {
                    reservaIdParam = value;
                    break;
                }
            }
            reservaId = reservaIdParam;
            document.getElementById('reservaIdDisplay').textContent = reservaId || 'No especificado';

            if (!reservaId) {
                document.getElementById('placeOrderBtn').disabled = true;
                showMessage('No se encontró la reservación.', true);
                return;
            }

            fetchPlatillos();
        });

        // Fetch platillos disponibles
        async function fetchPlatillos() {
            try {
                const res = await fetch(`${API_BASE_URL}/platillos`);
                if (!res.ok) throw new Error('No se pudo cargar el menú');
                const data = await res.json();
                platillosDisponibles = data.filter(p => p.disponible);
                renderPlatillos();
            } catch (err) {
                showMessage('Error al cargar el menú: ' + err.message, true);
            }
        }

        // Renderiza las cartas de platillos
        function renderPlatillos() {
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = '';
            platillosDisponibles.forEach(platillo => {
                const card = document.createElement('div');
                card.className = 'platillo-card';
                card.innerHTML = `
                    <img src="img/platillos/${platillo.platillo_id}.jpg" alt="Foto de ${platillo.nombre}" onerror="this.src='img/platillos/default.jpg'">
                    <h3>${platillo.nombre}</h3>
                    <p>${platillo.descripcion || ''}</p>
                    <p><strong>$${parseFloat(platillo.precio).toFixed(2)}</strong></p>
                    <div class="qty-selector">
                        <button class="qty-btn" data-action="minus">-</button>
                        <span class="qty-value" id="qty-${platillo.platillo_id}">0</span>
                        <button class="qty-btn" data-action="plus">+</button>
                    </div>
                    <button class="add-btn" id="add-${platillo.platillo_id}" disabled>Agregar</button>
                `;
                cardsContainer.appendChild(card);

                // Lógica de cantidad y agregar
                let qty = 0;
                const qtyValue = card.querySelector('.qty-value');
                const minusBtn = card.querySelector('.qty-btn[data-action="minus"]');
                const plusBtn = card.querySelector('.qty-btn[data-action="plus"]');
                const addBtn = card.querySelector('.add-btn');

                minusBtn.onclick = () => {
                    if (qty > 0) qty--;
                    qtyValue.textContent = qty;
                    addBtn.disabled = qty === 0;
                };
                plusBtn.onclick = () => {
                    qty++;
                    qtyValue.textContent = qty;
                    addBtn.disabled = qty === 0;
                };
                addBtn.onclick = () => {
                    addToPedido(platillo, qty);
                    qty = 0;
                    qtyValue.textContent = qty;
                    addBtn.disabled = true;
                };
            });
        }

        // Agrega o actualiza un platillo en el pedido
        function addToPedido(platillo, cantidad) {
            if (cantidad <= 0) return;
            const idx = pedido.findIndex(p => p.platillo_id === platillo.platillo_id);
            if (idx > -1) {
                pedido[idx].cantidad += cantidad;
            } else {
                pedido.push({
                    platillo_id: platillo.platillo_id,
                    nombre: platillo.nombre,
                    precio: platillo.precio,
                    cantidad: cantidad
                });
            }
            renderPedido();
        }

        // Renderiza el resumen del pedido
        function renderPedido() {
            const orderItems = document.getElementById('orderItems');
            orderItems.innerHTML = '';
            let total = 0;
            pedido.forEach(item => {
                const div = document.createElement('div');
                div.className = 'order-item';
                div.innerHTML = `
                    <span>${item.nombre} x${item.cantidad}</span>
                    <span>$${(item.precio * item.cantidad).toFixed(2)}</span>
                    <button class="remove-btn">Quitar</button>
                `;
                div.querySelector('.remove-btn').onclick = () => {
                    pedido = pedido.filter(p => p.platillo_id !== item.platillo_id);
                    renderPedido();
                };
                orderItems.appendChild(div);
                total += item.precio * item.cantidad;
            });
            document.getElementById('orderTotal').textContent = total.toFixed(2);
            document.getElementById('placeOrderBtn').disabled = pedido.length === 0;
        }

        // Mostrar mensajes
        function showMessage(msg, isError = false) {
            const area = document.getElementById('messageArea');
            area.textContent = msg;
            area.className = isError ? 'error-message' : 'success-message';
            setTimeout(() => { area.textContent = ''; area.className = ''; }, 4000);
        }

        // Enviar pedido al backend
        document.getElementById('placeOrderBtn').onclick = async () => {
            if (!reservaId || pedido.length === 0) return;
            try {
                const res = await fetch(`${API_BASE_URL}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reserva_id: reservaId,
                        items: pedido.map(p => ({
                            platillo_id: p.platillo_id,
                            cantidad: p.cantidad
                        }))
                    })
                });
                if (!res.ok) throw new Error('No se pudo enviar el pedido');
                showMessage('¡Pedido realizado con éxito!');
                // Limpia el pedido y redirige a pedidos.html después de 2s
                pedido = [];
                renderPedido();
                setTimeout(() => {
                    window.location.href = `pedidos.html?reserva_id=${reservaId}`;
                }, 2000);
            } catch (err) {
                showMessage('Error al enviar el pedido: ' + err.message, true);
            }
        };
    </script>
</body>
</html>
