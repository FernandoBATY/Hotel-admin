version: '3.8'

services:
  cockroach:
    image: cockroachdb/cockroach:v22.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    networks:
      - hotel-network

  cockroach1:
    image: cockroachdb/cockroach:v22.1.0
    command: start --insecure --join=cockroach,cockroach2,cockroach3
    volumes:
      - cockroach1-data:/cockroach/cockroach-data
    networks:
      - hotel-network

  cockroach2:
    image: cockroachdb/cockroach:v22.1.0
    command: start --insecure --join=cockroach,cockroach1,cockroach3
    volumes:
      - cockroach2-data:/cockroach/cockroach-data
    networks:
      - hotel-network

  cockroach3:
    image: cockroachdb/cockroach:v22.1.0
    command: start --insecure --join=cockroach,cockroach1,cockroach2
    volumes:
      - cockroach3-data:/cockroach/cockroach-data
    networks:
      - hotel-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      - DATABASE_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
    depends_on:
      - cockroach
    ports:
      - "3000:3000"
    networks:
      - hotel-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - hotel-network

volumes:
  cockroach-data:
  cockroach1-data:
  cockroach2-data:
  cockroach3-data:

networks:
  hotel-network:
    driver: bridge