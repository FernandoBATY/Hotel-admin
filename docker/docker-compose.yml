version: '3.8'

services:
  roach1:
    image: cockroachdb/cockroach:v23.1.11
    container_name: roach1
    hostname: roach1
    command: start --insecure --advertise-addr=roach1 --join=roach1 --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"
      - "8080:8080"
    networks:
      - roachnet

  roach2:
    image: cockroachdb/cockroach:v23.1.11
    container_name: roach2
    hostname: roach2
    command: start --insecure --advertise-addr=roach2 --join=roach1 --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
    ports:
      - "26258:26257"
      - "8081:8080"
    networks:
      - roachnet

networks:
  roachnet:
    driver: bridge
